<div class="flex flex-col h-full">
    <!-- Header -->
    <div class="flex-shrink-0 px-4 py-3 border-b border-border-subtle bg-panel/80">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i data-lucide="pencil" class="w-4 h-4"></i>
                <h2 class="text-sm font-medium text-zinc-100">Edit Note</h2>
            </div>
            <button onclick="closeSlideOver()"
                    class="text-zinc-400 hover:text-zinc-100">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- Form -->
    <form hx-post="{% url 'note_edit_drawer' note.pk %}"
          hx-target="#slide-over"
          hx-swap="innerHTML"
          class="flex-1 flex flex-col overflow-hidden">
        {% csrf_token %}

        {% if form.non_field_errors %}
        <div class="mx-4 mt-4 p-3 bg-red-500/10 border border-red-500/20 rounded-card">
            {% for error in form.non_field_errors %}
            <p class="text-sm text-red-400">{{ error }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <div class="flex-1 overflow-y-auto p-4 space-y-4">
            <div>
                <label for="id_title" class="text-xs text-zinc-500 uppercase tracking-wide mb-2 block">
                    Title <span class="text-red-400">*</span>
                </label>
                {{ form.title }}
                {% if form.title.errors %}
                <p class="text-xs text-red-400 mt-1">{{ form.title.errors.0 }}</p>
                {% endif %}
            </div>

            <div>
                <label for="id_description" class="text-xs text-zinc-500 uppercase tracking-wide mb-2 block">
                    Description
                </label>
                {{ form.description }}
            </div>

            <div class="flex items-center gap-3 p-3 bg-elevated/50 rounded-card border border-border-subtle">
                {{ form.is_private }}
                <label for="id_is_private" class="text-sm text-zinc-300 flex items-center gap-2">
                    <i data-lucide="lock" class="w-4 h-4"></i>
                    Make this note private
                    <span class="text-xs text-zinc-500">(Only you and admins can view)</span>
                </label>
            </div>
        </div>

        <div class="flex-shrink-0 px-4 py-3 border-t border-border-subtle bg-panel/80">
            <div class="flex gap-3">
                <button type="submit"
                        class="flex items-center justify-center gap-2 px-4 py-2 bg-accent hover:bg-accent-hover text-white rounded-card text-sm transition-colors">
                    <i data-lucide="check" class="w-4 h-4"></i>
                    Save Changes
                </button>
                <button type="button"
                        hx-get="{% url 'note_detail_drawer' note.pk %}"
                        hx-target="#slide-over"
                        hx-swap="innerHTML"
                        class="bg-elevated border border-border-subtle px-4 py-2 rounded-card text-sm text-zinc-400 hover:text-zinc-200 hover:bg-hover-strong transition-colors">
                    Cancel
                </button>
            </div>
        </div>
    </form>
</div>
