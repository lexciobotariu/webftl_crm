{% if invoice.status == 'paid' %}
<span class="px-2 py-0.5 text-[10px] rounded bg-green-500/10 text-green-400 border border-green-500/20">Paid</span>
{% elif invoice.status == 'partial' %}
<span class="px-2 py-0.5 text-[10px] rounded bg-amber-500/10 text-amber-300 border border-amber-500/20">Partial</span>
{% elif invoice.status == 'overdue' %}
<span class="px-2 py-0.5 text-[10px] rounded bg-red-500/10 text-red-300 border border-red-500/20">Overdue</span>
{% elif invoice.status == 'sent' %}
<span class="px-2 py-0.5 text-[10px] rounded bg-sky-500/10 text-sky-300 border border-sky-500/20">Sent</span>
{% else %}
<span class="px-2 py-0.5 text-[10px] rounded bg-zinc-500/10 text-zinc-400 border border-border-subtle">Draft</span>
{% endif %}
