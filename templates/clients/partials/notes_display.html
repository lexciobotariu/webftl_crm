<div class="px-4 py-2 border-b border-border-subtle bg-panel/80">
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
            <i data-lucide="file-text" class="w-4 h-4 text-zinc-500"></i>
            <h2 class="text-sm font-medium text-zinc-100">Notes</h2>
        </div>
        {% if client.notes %}
        <button hx-get="{% url 'client_edit_notes' client.pk %}"
                hx-target="#notes-section"
                hx-swap="innerHTML"
                class="inline-flex items-center gap-1.5 text-xs text-zinc-400 hover:text-zinc-200 transition-colors">
            <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
            Edit
        </button>
        {% else %}
        <button hx-get="{% url 'client_edit_notes' client.pk %}"
                hx-target="#notes-section"
                hx-swap="innerHTML"
                class="inline-flex items-center gap-1.5 text-xs text-zinc-400 hover:text-zinc-200 transition-colors">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            Add Note
        </button>
        {% endif %}
    </div>
</div>
<div class="p-4">
    {% if client.notes %}
    <div class="text-sm text-zinc-300 whitespace-pre-wrap">{{ client.notes }}</div>
    {% else %}
    <div class="text-sm text-zinc-600">No notes added yet.</div>
    {% endif %}
</div>
