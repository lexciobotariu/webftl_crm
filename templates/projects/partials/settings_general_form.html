<form id="general-settings-form"
      hx-post="{% url 'project_settings_update' project.pk %}"
      hx-target="#general-settings-form"
      hx-swap="outerHTML"
      class="space-y-4">
    {% csrf_token %}

    {% if success %}
    <div class="bg-green-500/10 border border-green-500/30 rounded-card px-3 py-2 text-sm text-green-400 flex items-center gap-2"
         x-data="{ show: true }"
         x-show="show"
         x-init="setTimeout(() => show = false, 3000)">
        <i data-lucide="check-circle" class="w-4 h-4"></i>
        Settings saved successfully.
    </div>
    {% endif %}

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-[11px] uppercase tracking-[0.18em] text-zinc-500 mb-2">Name</label>
            <input type="text" name="name" value="{{ project.name }}" required
                   class="w-full bg-elevated border border-border-subtle rounded-card px-3 py-2 text-sm text-zinc-100 focus:border-accent focus:ring-1 focus:ring-accent focus:outline-none {% if errors.name %}border-red-500{% endif %}">
            {% if errors.name %}
            <p class="text-red-500 text-xs mt-1">{{ errors.name }}</p>
            {% endif %}
        </div>
        <div>
            <label class="block text-[11px] uppercase tracking-[0.18em] text-zinc-500 mb-2">Client</label>
            <div class="flex items-center gap-2 bg-elevated/50 border border-border-subtle rounded-card px-3 py-2">
                <i data-lucide="building-2" class="w-4 h-4 text-zinc-500"></i>
                <span class="text-sm text-zinc-400">{{ project.client.name }}</span>
            </div>
        </div>
    </div>

    <div>
        <label class="block text-[11px] uppercase tracking-[0.18em] text-zinc-500 mb-2">Description</label>
        <textarea name="description" rows="3" placeholder="Project description..."
                  class="w-full bg-elevated border border-border-subtle rounded-card px-3 py-2 text-sm text-zinc-100 focus:border-accent focus:ring-1 focus:ring-accent focus:outline-none resize-none">{{ project.description }}</textarea>
    </div>

    <div>
        <label class="block text-[11px] uppercase tracking-[0.18em] text-zinc-500 mb-2">GitHub Repository</label>
        <div class="relative">
            <iconify-icon icon="simple-icons:github" width="16" height="16" class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500"></iconify-icon>
            <input type="url" name="github_repo_url" value="{{ project.github_repo_url }}" placeholder="https://github.com/org/repo"
                   class="w-full bg-elevated border border-border-subtle rounded-card pl-10 pr-3 py-2 text-sm text-zinc-100 focus:border-accent focus:ring-1 focus:ring-accent focus:outline-none">
        </div>
    </div>

    <div class="flex justify-end pt-2">
        <button type="submit" class="bg-accent text-white px-4 py-2 rounded-card text-sm hover:bg-accent-hover transition-colors flex items-center gap-2">
            <i data-lucide="save" class="w-4 h-4"></i>
            Save Changes
        </button>
    </div>
</form>
