<div class="flex gap-3 mt-6 pt-4 border-t border-border-subtle">
    <button type="submit" title="Save (Ctrl/⌘ Enter)" aria-keyshortcuts="Control+Enter Meta+Enter"
            class="bg-accent text-on-accent px-4 py-2 rounded-control text-sm font-medium hover:bg-accent-hover transition-colors">{{ label }}</button>
    <button type="button" onclick="closeSlideOver()" class="bg-elevated border border-border-subtle px-4 py-2 rounded-control text-sm text-zinc-400 hover:text-zinc-200 hover:bg-hover-strong transition-colors">Cancel</button>
</div>
