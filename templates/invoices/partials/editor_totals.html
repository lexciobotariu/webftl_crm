<div id="doc-totals" {% if oob_totals %}hx-swap-oob="true"{% endif %} class="border-t border-border-subtle px-4 py-3 space-y-1.5">
    <div class="flex justify-end items-center gap-8 text-sm">
        <span class="text-zinc-500">Subtotal</span>
        <span class="text-zinc-200 w-28 text-right tabular-nums">{% include "invoices/partials/money.html" with amount=doc.subtotal %}</span>
    </div>
    <div class="flex justify-end items-center gap-8 text-sm">
        <label for="doc-tax" class="flex items-center gap-2 text-zinc-500">
            Tax
            <input id="doc-tax" type="number" name="tax_rate" step="0.01" min="0" max="100" required value="{{ doc.tax_rate|stringformat:'s' }}"
                   hx-post="{{ header_url }}" hx-trigger="change" hx-include="#doc-header" hx-target="#doc-header" hx-swap="outerHTML"
                   class="w-20 bg-elevated border border-border-subtle rounded-control px-2 py-1 text-sm text-zinc-100 text-right tabular-nums focus:border-border-strong focus:outline-none">
            %
        </label>
        <span class="text-zinc-200 w-28 text-right tabular-nums">{% include "invoices/partials/money.html" with amount=doc.tax_amount %}</span>
    </div>
    {% if form.tax_rate.errors %}<p class="text-right text-xs text-error">{{ form.tax_rate.errors.0 }}</p>{% endif %}
    <div class="flex justify-end items-center gap-8 text-sm font-medium">
        <span class="text-zinc-300">Total</span>
        <span class="text-zinc-100 w-28 text-right tabular-nums">{% include "invoices/partials/money.html" with amount=doc.total %}</span>
    </div>
</div>
