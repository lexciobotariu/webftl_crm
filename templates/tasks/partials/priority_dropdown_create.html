<div class="relative" x-data="{ open: false, selected: '{{ form.priority.value|default:'' }}' }">
    <input type="hidden" name="priority" :value="selected">
    <button type="button" @click="open = !open"
            class="flex items-center gap-2 px-2 py-1.5 rounded-card text-sm hover:bg-elevated transition-colors w-full"
            :class="{
                'text-red-400': selected === 'urgent',
                'text-orange-400': selected === 'high',
                'text-yellow-400': selected === 'medium',
                'text-zinc-400': selected === 'low' || selected === ''
            }">
        <template x-if="selected">
            <span class="flex items-center gap-2">
                <i data-lucide="signal" class="w-3.5 h-3.5"></i>
                <span x-text="selected === 'urgent' ? 'Urgent' : selected === 'high' ? 'High' : selected === 'medium' ? 'Medium' : selected === 'low' ? 'Low' : 'None'"></span>
            </span>
        </template>
        <template x-if="!selected">
            <span class="text-zinc-500">None</span>
        </template>
    </button>
    <div x-show="open" @click.away="open = false"
         x-transition
         class="absolute left-0 top-full mt-1 w-40 bg-elevated border border-border-subtle rounded-card shadow-lg z-20 py-1">
        <button type="button" @click="selected = ''; open = false"
                class="w-full text-left px-3 py-2 text-sm hover:bg-hover-strong transition-colors text-zinc-400">
            None
        </button>
        {% for value, label in priority_choices %}
        <button type="button" @click="selected = '{{ value }}'; open = false"
                class="w-full text-left px-3 py-2 text-sm hover:bg-hover-strong transition-colors
                       {% if value == 'urgent' %}text-red-400{% elif value == 'high' %}text-orange-400{% elif value == 'medium' %}text-yellow-400{% else %}text-zinc-300{% endif %}">
            {{ label }}
        </button>
        {% endfor %}
    </div>
</div>
