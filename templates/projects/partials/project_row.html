<tr class="hover:bg-elevated/50 transition-colors" id="project-{{ project.pk }}">
    <td class="px-4 py-3">
        <a href="{% url 'project_board' project.pk %}" class="font-medium text-sm text-zinc-100 hover:text-accent transition-colors">
            {{ project.name }}
        </a>
    </td>
    <td class="px-4 py-3">
        {% if project.client %}
        <a href="{% url 'client_detail' project.client.pk %}" class="text-sm text-zinc-400 hover:text-zinc-200 transition-colors">
            {{ project.client.name }}
        </a>
        {% else %}
        <span class="text-sm text-zinc-600">—</span>
        {% endif %}
    </td>
    <td class="px-4 py-3">
        {% if project.description %}
        <span class="text-sm text-zinc-500 truncate max-w-xs block">{{ project.description|truncatechars:50 }}</span>
        {% else %}
        <span class="text-sm text-zinc-600">—</span>
        {% endif %}
    </td>
    <td class="px-4 py-3 text-center">
        <span class="text-sm text-zinc-400">{{ project.task_count }}</span>
    </td>
    <td class="px-4 py-3">
        <div class="flex items-center justify-end gap-1">
            <a href="{% url 'project_board' project.pk %}"
               class="p-1.5 text-zinc-500 hover:text-zinc-200 hover:bg-elevated rounded transition-colors"
               title="View Board">
                <i data-lucide="kanban" class="w-4 h-4"></i>
            </a>
        </div>
    </td>
</tr>
