<tr class="hover:bg-elevated/50 transition-colors group" id="client-{{ client.pk }}">
    <td class="px-4 py-3">
        <a href="{% url 'client_detail' client.pk %}" class="font-medium text-sm text-zinc-100 hover:text-accent transition-colors">
            {{ client.name }}
        </a>
    </td>
    <td class="px-4 py-3">
        {% if client.email %}
        <a href="mailto:{{ client.email }}" class="text-sm text-zinc-400 hover:text-zinc-200 transition-colors">
            {{ client.email }}
        </a>
        {% else %}
        <span class="text-sm text-zinc-600">—</span>
        {% endif %}
    </td>
    <td class="px-4 py-3">
        {% if client.phone %}
        <a href="tel:{{ client.phone }}" class="text-sm text-zinc-400 hover:text-zinc-200 transition-colors">
            {{ client.phone }}
        </a>
        {% else %}
        <span class="text-sm text-zinc-600">—</span>
        {% endif %}
    </td>
    <td class="px-4 py-3 text-center">
        <span class="text-sm text-zinc-400">{{ client.project_count }}</span>
    </td>
    <td class="px-4 py-3">
        <div class="flex items-center justify-end gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
            <a href="{% url 'client_detail' client.pk %}"
               class="p-1.5 text-zinc-500 hover:text-zinc-200 hover:bg-elevated rounded transition-colors"
               title="View">
                <i data-lucide="eye" class="w-4 h-4"></i>
            </a>
        </div>
    </td>
</tr>
