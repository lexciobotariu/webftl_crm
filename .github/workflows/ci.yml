name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: webftl_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/webftl_crm_test
      SECRET_KEY: ci-test-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      # Throwaway key for CI only — never reuse this anywhere real.
      FERNET_KEY: "wjMstAJ1YaHiEvA5UhoCGyUVpL9KznFWGOZ4_ckjinA="
      # DEBUG=False turns on SECURE_SSL_REDIRECT, which would 301 every test request.
      SECURE_SSL_REDIRECT: "False"
      SECURE_HSTS_SECONDS: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Django checks
        run: python manage.py check

      # DEBUG=False uses the manifest static storage, so templates cannot render
      # until the manifest exists.
      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Run tests
        run: pytest -q
