{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WebFTL CRM{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0d0d0d',
                            sidebar: '#0a0a0a',
                            card: '#171717',
                            hover: '#262626',
                            border: '#262626',
                        },
                        accent: {
                            DEFAULT: '#8b5cf6',
                            hover: '#a78bfa',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    keyframes: {
                        'slide-in-right': {
                            '0%': { transform: 'translateX(100%)' },
                            '100%': { transform: 'translateX(0)' },
                        }
                    },
                    animation: {
                        'slide-in-right': 'slide-in-right 0.2s ease-out',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body class="h-full bg-dark-bg text-neutral-100 selection:bg-accent/30" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    {% if user.is_authenticated %}
    <div class="min-h-full flex">
        {% include "components/sidebar.html" %}
        <main class="flex-1 p-8 overflow-auto">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% else %}
    <main class="min-h-full flex items-center justify-center bg-dark-bg">
        {% block auth_content %}{% endblock %}
    </main>
    {% endif %}

    <!-- Slide-over panel container -->
    <div id="slide-over" class="hidden"></div>

    <!-- Modal container -->
    <div id="modal" class="hidden"></div>

    <!-- Initialize Lucide icons -->
    <script>
        lucide.createIcons();
        // Re-init icons after HTMX swaps
        document.body.addEventListener('htmx:afterSwap', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
