{% comment %}Fonts and the Tailwind theme, shared by the app (base.html) and the client portal (portal/base.html).{% endcomment %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Surfaces, borders, hover, and zinc read the theme in custom.css.
                        'bg': 'rgb(var(--bg) / <alpha-value>)',
                        'sidebar': 'rgb(var(--sidebar) / <alpha-value>)',
                        'panel': 'rgb(var(--panel) / <alpha-value>)',
                        'card': 'rgb(var(--card) / <alpha-value>)',
                        'elevated': 'rgb(var(--elevated) / <alpha-value>)',
                        'border': 'rgb(var(--border) / <alpha-value>)',
                        'border-subtle': 'rgb(var(--border-subtle) / <alpha-value>)',
                        'border-strong': 'rgb(var(--border-strong) / <alpha-value>)',
                        'hover': 'var(--hover)',
                        'hover-strong': 'var(--hover-strong)',
                        'accent': {
                            DEFAULT: '#8b5cf6',
                            hover: '#a78bfa',
                            muted: 'rgba(139, 92, 246, 0.16)',
                        },
                        'on-accent': '#ffffff',
                        'success': '#27a644',
                        'error': '#eb5757',
                        // Document grays, so existing zinc utilities pick up the palette.
                        'zinc': {
                            50: 'rgb(var(--zinc-50) / <alpha-value>)',
                            100: 'rgb(var(--zinc-100) / <alpha-value>)',
                            200: 'rgb(var(--zinc-200) / <alpha-value>)',
                            300: 'rgb(var(--zinc-300) / <alpha-value>)',
                            400: 'rgb(var(--zinc-400) / <alpha-value>)',
                            500: 'rgb(var(--zinc-500) / <alpha-value>)',
                            600: 'rgb(var(--zinc-600) / <alpha-value>)',
                            700: 'rgb(var(--zinc-700) / <alpha-value>)',
                            800: 'rgb(var(--zinc-800) / <alpha-value>)',
                            900: 'rgb(var(--zinc-900) / <alpha-value>)',
                            950: 'rgb(var(--zinc-950) / <alpha-value>)',
                        },
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    fontWeight: {
                        medium: '510',
                    },
                    borderRadius: {
                        'badge': '4px',
                        'control': '6px',
                        'card': '12px',
                        'panel': '12px',
                    },
                    keyframes: {
                        'slide-in-right': {
                            '0%': { transform: 'translateX(100%)' },
                            '100%': { transform: 'translateX(0)' },
                        },
                        'fade-up': {
                            '0%': { opacity: '0', transform: 'translateY(8px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        'soft-pulse': {
                            '0%, 100%': { opacity: '0.6' },
                            '50%': { opacity: '1' },
                        },
                    },
                    animation: {
                        'slide-in-right': 'slide-in-right 0.2s ease-out',
                        'fade-up': 'fade-up 0.35s ease-out',
                        'soft-pulse': 'soft-pulse 2.2s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
