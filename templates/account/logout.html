{% extends "base.html" %}

{% block title %}Sign Out - WebFTL CRM{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md mx-auto">
    <div class="text-center mb-8">
        <div class="text-[11px] uppercase tracking-[0.2em] text-zinc-500">Account</div>
        <h1 class="text-2xl font-semibold text-zinc-100 mt-2">Sign out</h1>
        <p class="text-zinc-400 mt-2">Are you sure you want to sign out?</p>
    </div>

    <form method="post" action="{% url 'account_logout' %}" class="space-y-6">
        {% csrf_token %}
        <button type="submit"
                class="w-full py-3 px-4 bg-accent hover:bg-accent-hover text-white font-medium rounded-card transition-colors focus:outline-none focus:ring-2 focus:ring-accent focus:ring-offset-2 focus:ring-offset-bg">
            Sign out
        </button>
        <a href="/"
           class="block w-full py-3 px-4 text-center text-zinc-400 hover:text-zinc-300 transition-colors">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
