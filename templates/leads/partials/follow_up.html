{# The follow-up date of ``lead``, with Overdue / Today. #}{% if lead.next_follow_up %}{% with state=lead.follow_up_state %}<span class="inline-flex items-center gap-1 text-xs {% if state == 'overdue' %}text-error{% elif state == 'today' %}text-amber-400{% else %}text-zinc-500{% endif %}" title="Next follow-up">
    <i data-lucide="bell" class="w-3 h-3"></i>{% if state == 'today' %}Today{% else %}{{ lead.next_follow_up|date:"j M" }}{% endif %}{% if state == 'overdue' %} · overdue{% endif %}
</span>{% endwith %}{% endif %}
