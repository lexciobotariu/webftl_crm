<div x-data="dropdown"{% if estimate_error %} x-init="open = true"{% endif %}>
    <button @click="toggle()"
            class="flex items-center gap-2 px-2 py-1 rounded-control text-sm text-zinc-300 hover:bg-elevated transition-colors">
        {% if task.estimate_minutes %}
        {{ task.estimate_label }}
        {% else %}
        <span class="text-zinc-500">Add estimate</span>
        {% endif %}
    </button>
    <div x-show="open" x-cloak @click.away="close()"
         x-transition
         class="absolute left-0 right-0 top-full mt-1 bg-elevated border border-border-subtle rounded-card shadow-lg z-20 p-3">
        <form hx-post="{% url 'task_update_estimate' task.pk %}"
              hx-target="#estimate-value-{{ task.pk }}"
              hx-swap="innerHTML">
            {% csrf_token %}
            <input type="text" name="estimate" value="{% if estimate_error %}{{ estimate_text }}{% else %}{{ task.estimate_label }}{% endif %}"
                   placeholder="e.g. 1h 30m" autocomplete="off" aria-label="Estimate"
                   {% if estimate_error %}aria-invalid="true" aria-describedby="estimate-error-{{ task.pk }}"{% endif %}
                   class="w-full bg-panel border border-border-subtle rounded-control px-3 py-2 text-sm text-zinc-100 focus:border-border-strong focus:outline-none">
            <button type="submit" class="bg-accent text-on-accent px-3 py-1 rounded-control text-xs mt-2">Save</button>
            {% if estimate_error %}
            <p id="estimate-error-{{ task.pk }}" class="text-error text-xs mt-2">{{ estimate_error }}</p>
            {% endif %}
        </form>
    </div>
</div>
