<div x-data="{ saving: false }">
    <form hx-post="{% url 'task_edit_description' task.pk %}"
          hx-target="#task-description-{{ task.pk }}"
          hx-swap="innerHTML"
          @htmx:before-request="saving = true"
          class="space-y-2">
        {% csrf_token %}
        {% with pk_str=task.pk|stringformat:"s" %}
        {% include "tasks/partials/markdown_editor.html" with uid="description-"|add:pk_str name="description" value=task.description rows=6 placeholder="Add a description..." autofocus=True %}
        {% endwith %}
        <div class="flex items-center gap-2">
            <button type="submit"
                    :disabled="saving"
                    class="bg-accent text-on-accent px-3 py-1.5 rounded-control text-xs font-medium hover:bg-accent-hover transition-colors disabled:opacity-50">
                <span x-show="!saving">Save</span>
                <span x-show="saving" x-cloak>Saving...</span>
            </button>
            <button type="button"
                    hx-get="{% url 'task_edit_description' task.pk %}?cancel=1"
                    hx-target="#task-description-{{ task.pk }}"
                    hx-swap="innerHTML"
                    class="text-zinc-500 hover:text-zinc-300 px-3 py-1.5 text-xs transition-colors">
                Cancel
            </button>
        </div>
    </form>
</div>
<script>
// Escape in Write cancels the edit; in Preview the editor takes it first.
document.querySelector('#task-description-{{ task.pk }} textarea').addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        htmx.ajax('GET', '{% url 'task_edit_description' task.pk %}?cancel=1', {target: '#task-description-{{ task.pk }}', swap: 'innerHTML'});
        e.preventDefault();
    }
});
</script>
