<div class="relative" id="status-dropdown-{{ task.pk }}" x-data="dropdown">
    <button @click="toggle()"
            class="flex items-center gap-2 px-2 py-1 rounded-control text-sm text-zinc-300 hover:bg-elevated transition-colors">
        {% include "components/status_icon.html" with category=task.status.category %}
        <span>{{ task.status.name }}</span>
    </button>
    <div x-show="open" x-cloak @click.away="close()"
         x-transition
         class="absolute left-0 top-full mt-1 w-48 bg-elevated border border-border-subtle rounded-card shadow-lg z-20 py-1">
        {% for status in task.project.statuses.all %}
        <button hx-post="{% url 'task_update_status' task.pk %}"
                hx-vals='{"status_id": "{{ status.pk }}"}'
                hx-target="#status-dropdown-{{ task.pk }}"
                hx-swap="outerHTML"
                @click="close()"
                class="w-full flex items-center gap-2 text-left px-3 py-2 text-sm hover:bg-hover-strong transition-colors {% if status.pk == task.status.pk %}text-zinc-200{% else %}text-zinc-300{% endif %}">
            {% include "components/status_icon.html" with category=status.category %}
            {{ status.name }}
        </button>
        {% endfor %}
    </div>
</div>
