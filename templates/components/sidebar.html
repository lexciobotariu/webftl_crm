<aside class="w-60 bg-sidebar min-h-screen border-r border-border-subtle flex flex-col">
    <!-- Logo -->
    <div class="px-4 py-4 border-b border-border-subtle">
        <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-lg bg-elevated border border-border-subtle flex items-center justify-center text-xs font-semibold text-zinc-200">
                WF
            </div>
            <div>
                <div class="text-sm font-semibold text-zinc-100 tracking-tight">WebFTL CRM</div>
                <div class="text-[11px] text-zinc-500">Workspace</div>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-2 py-3 space-y-1">
        <a href="{% url 'dashboard' %}"
           class="flex items-center gap-2.5 px-3 py-2 rounded-card text-[13px] font-medium transition-colors duration-150
                  {% if request.resolver_match.url_name == 'dashboard' %}
                  bg-elevated text-zinc-100 border border-border-subtle
                  {% else %}
                  text-zinc-400 hover:text-zinc-200 hover:bg-hover
                  {% endif %}">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            Dashboard
        </a>
        <a href="{% url 'client_list' %}"
           class="flex items-center gap-2.5 px-3 py-2 rounded-card text-[13px] font-medium transition-colors duration-150
                  {% if 'client' in request.resolver_match.url_name %}
                  bg-elevated text-zinc-100 border border-border-subtle
                  {% else %}
                  text-zinc-400 hover:text-zinc-200 hover:bg-hover
                  {% endif %}">
            <i data-lucide="building-2" class="w-4 h-4"></i>
            Clients
        </a>
        <a href="{% url 'project_list' %}"
           class="flex items-center gap-2.5 px-3 py-2 rounded-card text-[13px] font-medium transition-colors duration-150
                  {% if 'project' in request.resolver_match.url_name %}
                  bg-elevated text-zinc-100 border border-border-subtle
                  {% else %}
                  text-zinc-400 hover:text-zinc-200 hover:bg-hover
                  {% endif %}">
            <i data-lucide="folder-kanban" class="w-4 h-4"></i>
            Projects
        </a>
        <a href="{% url 'my_tasks' %}"
           class="flex items-center gap-2.5 px-3 py-2 rounded-card text-[13px] font-medium transition-colors duration-150
                  {% if request.resolver_match.url_name == 'my_tasks' %}
                  bg-elevated text-zinc-100 border border-border-subtle
                  {% else %}
                  text-zinc-400 hover:text-zinc-200 hover:bg-hover
                  {% endif %}">
            <i data-lucide="user-check" class="w-4 h-4"></i>
            My Tasks
        </a>
        {% if user.role == 'admin' %}
        <a href="{% url 'team_list' %}"
           class="flex items-center gap-2.5 px-3 py-2 rounded-card text-[13px] font-medium transition-colors duration-150
                  {% if 'team' in request.resolver_match.url_name %}
                  bg-elevated text-zinc-100 border border-border-subtle
                  {% else %}
                  text-zinc-400 hover:text-zinc-200 hover:bg-hover
                  {% endif %}">
            <i data-lucide="users" class="w-4 h-4"></i>
            Team
        </a>
        {% endif %}
    </nav>

    <!-- User section -->
    <div class="px-2 py-3 border-t border-border-subtle">
        <div class="flex items-center gap-2.5 px-3 py-2 rounded-card bg-panel/60 border border-border-subtle">
            <div class="w-7 h-7 rounded-full bg-accent-muted flex items-center justify-center">
                <span class="text-accent text-xs font-semibold">{{ user.name|slice:":1"|upper }}</span>
            </div>
            <div class="flex-1 min-w-0">
                <div class="text-sm text-zinc-200 truncate">{{ user.name }}</div>
                <div class="text-xs text-zinc-500 truncate">{{ user.email }}</div>
            </div>
        </div>
        <a href="{% url 'account_logout' %}"
           class="flex items-center gap-2.5 px-3 py-2 mt-1 rounded-card text-sm text-zinc-500 hover:text-red-400 hover:bg-hover transition-colors duration-150">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            Logout
        </a>
    </div>
</aside>
