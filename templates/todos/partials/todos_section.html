{% load static %}

<!-- Todos Section - Static Wrapper -->
<div class="border border-border-subtle rounded-card bg-panel/50 overflow-hidden">
    <!-- Header with controls -->
    <div class="px-4 py-2 border-b border-border-subtle bg-panel/80">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i data-lucide="check-square" class="w-4 h-4 text-zinc-500"></i>
                <h2 class="text-sm font-medium text-zinc-100">
                    {% if client %}To-Dos{% else %}Personal To-Dos{% endif %}
                </h2>
                <span id="todos-count-badge" class="text-xs text-zinc-500 bg-elevated px-1.5 py-0.5 rounded">{{ todo_count|default:todos.count }}</span>
                {% if client %}
                <span class="hidden sm:inline-flex items-center gap-1 text-xs text-zinc-500" data-testid="todos-private-note">
                    <i data-lucide="lock" class="w-3 h-3"></i>
                    Only you see these
                </span>
                {% endif %}
            </div>
            <div class="flex items-center gap-3">
                <!-- Show completed toggle -->
                <button data-show-completed="{{ show_completed|yesno:'true,false' }}"
                        hx-get="{% if client %}{% url 'client_todo_list' client.id %}{% else %}{% url 'todo_list' %}{% endif %}"
                        hx-target="#todos-list-container"
                        hx-swap="innerHTML"
                        hx-vals='js:{show_completed: toggleShowCompleted(this)}'
                        class="flex items-center gap-2 px-3 py-1.5 text-xs text-zinc-400 hover:text-zinc-200 hover:bg-hover rounded-lg transition-colors">
                    <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                    <span data-show-completed-label>{% if show_completed %}Hide{% else %}Show{% endif %} completed</span>
                </button>
                <!-- Add todo button -->
                <button hx-get="{% if client %}{% url 'client_todo_create' client.id %}{% else %}{% url 'todo_create' %}{% endif %}"
                        hx-target="#slide-over"
                        hx-swap="innerHTML"
                        data-after-success="open-drawer"
                        class="inline-flex items-center gap-1.5 bg-accent text-on-accent px-3 py-1.5 rounded-control text-xs font-medium hover:bg-accent-hover transition-colors">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    Add To-Do
                </button>
            </div>
        </div>
    </div>

    <!-- Todo list container (HTMX target) -->
    <div id="todos-list-container"
         data-show-completed="{{ show_completed|yesno:'true,false' }}"
         hx-get="{% if client %}{% url 'client_todo_list' client.id %}{% else %}{% url 'todo_list' %}{% endif %}"
         hx-trigger="{% if client %}refreshClientTodos from:body{% else %}refreshPersonalTodos from:body{% endif %}"
         hx-target="#todos-list-container"
         hx-swap="innerHTML">
        {% include 'todos/partials/todo_list.html' %}
    </div>
</div>

<script>
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }
</script>
<script>
    // "Show completed": flips the button's state and returns it as the request's
    // show_completed value. The list keeps the same choice for its own refreshes.
    window.toggleShowCompleted = window.toggleShowCompleted || function (button) {
        const next = button.dataset.showCompleted === 'true' ? 'false' : 'true';
        button.dataset.showCompleted = next;
        const list = document.getElementById('todos-list-container');
        const endpoint = (button.getAttribute('hx-get') || '').split('?')[0];
        if (list) {
            list.dataset.showCompleted = next;
            list.setAttribute('hx-get', next === 'true' ? `${endpoint}?show_completed=true` : endpoint);
        }
        const label = button.querySelector('[data-show-completed-label]');
        if (label) label.textContent = next === 'true' ? 'Hide completed' : 'Show completed';
        return next;
    };
</script>
