<div class="relative" x-data="{ open: false, selected: '{{ form.priority.value|default:'' }}' }">
    <input type="hidden" name="priority" :value="selected">
    <button type="button" @click="open = !open"
            class="flex items-center gap-2 px-2 py-1.5 rounded-control text-sm text-zinc-300 hover:bg-elevated transition-colors w-full">
        <span x-show="selected === 'urgent'">{% include "components/priority_icon.html" with priority="urgent" %}</span>
        <span x-show="selected === 'high'">{% include "components/priority_icon.html" with priority="high" %}</span>
        <span x-show="selected === 'medium'">{% include "components/priority_icon.html" with priority="medium" %}</span>
        <span x-show="selected === 'low'">{% include "components/priority_icon.html" with priority="low" %}</span>
        <span x-show="!selected">{% include "components/priority_icon.html" with priority="" %}</span>
        <template x-if="selected">
            <span x-text="selected === 'urgent' ? 'Urgent' : selected === 'high' ? 'High' : selected === 'medium' ? 'Medium' : selected === 'low' ? 'Low' : 'None'"></span>
        </template>
        <template x-if="!selected">
            <span class="text-zinc-500">None</span>
        </template>
    </button>
    <div x-show="open" x-cloak @click.away="open = false"
         x-transition
         class="absolute left-0 top-full mt-1 w-40 bg-elevated border border-border-subtle rounded-card shadow-lg z-20 py-1">
        <button type="button" @click="selected = ''; open = false"
                class="w-full flex items-center gap-2 text-left px-3 py-2 text-sm hover:bg-hover-strong transition-colors text-zinc-400">
            {% include "components/priority_icon.html" with priority="" %}
            None
        </button>
        {% for value, label in priority_choices %}
        <button type="button" @click="selected = '{{ value }}'; open = false"
                class="w-full flex items-center gap-2 text-left px-3 py-2 text-sm hover:bg-hover-strong transition-colors text-zinc-300">
            {% include "components/priority_icon.html" with priority=value %}
            {{ label }}
        </button>
        {% endfor %}
    </div>
</div>
