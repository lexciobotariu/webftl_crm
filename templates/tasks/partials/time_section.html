<div id="time-tracking-{{ task.pk }}"
     hx-get="{% url 'task_time_section' task.pk %}{% if full_page %}?full_page=1{% endif %}"
     hx-trigger="timerChanged from:body"
     hx-swap="outerHTML">
    <div class="{% if full_page %}mb-5{% endif %}">
        <h3 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Time</h3>
        <div id="time-entry-list-{{ task.pk }}" class="space-y-1">
            {% for entry in time_entries %}
            {% include "tasks/partials/time_entry_item.html" %}
            {% empty %}
            <p class="text-sm text-zinc-500 py-1">No time logged yet.</p>
            {% endfor %}
        </div>
    </div>
</div>
