<div{% if wide %} class="sm:col-span-2"{% endif %}>
    <label class="block text-[11px] uppercase tracking-[0.18em] text-zinc-500 mb-2" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="text-xs text-zinc-500 mt-1">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}<p class="text-error text-sm mt-1">{{ field.errors.0 }}</p>{% endif %}
</div>
