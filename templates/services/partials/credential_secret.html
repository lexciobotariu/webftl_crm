{% if credential.password %}<div>Password <span class="text-zinc-100 font-mono select-all break-all">{{ credential.password }}</span>
    <button type="button" class="ml-1 text-zinc-500 hover:text-zinc-200" aria-label="Copy password"
            onclick="navigator.clipboard && navigator.clipboard.writeText(this.previousElementSibling.textContent); this.textContent = 'Copied';">Copy</button></div>{% endif %}
{% if credential.notes %}<div class="mt-1 whitespace-pre-line text-zinc-300">{{ credential.notes }}</div>{% endif %}
