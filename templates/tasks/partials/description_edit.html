<div x-data="{ saving: false }">
    <form hx-post="{% url 'task_edit_description' task.pk %}"
          hx-target="#task-description-{{ task.pk }}"
          hx-swap="innerHTML"
          @htmx:before-request="saving = true"
          class="space-y-2">
        {% csrf_token %}
        <textarea name="description" rows="4"
                  class="w-full bg-panel border border-border-subtle rounded-card px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:border-accent focus:outline-none resize-none"
                  placeholder="Add a description..."
                  autofocus>{{ task.description|default:"" }}</textarea>
        <div class="flex items-center gap-2">
            <button type="submit"
                    :disabled="saving"
                    class="bg-accent text-white px-3 py-1.5 rounded-card text-xs font-medium hover:bg-accent-hover transition-colors disabled:opacity-50">
                <span x-show="!saving">Save</span>
                <span x-show="saving">Saving...</span>
            </button>
            <button type="button"
                    hx-get="{% url 'task_detail' task.pk %}"
                    hx-target="#slide-over-content"
                    class="text-zinc-500 hover:text-zinc-300 px-3 py-1.5 text-xs transition-colors">
                Cancel
            </button>
        </div>
    </form>
</div>
