<input type="text" name="{{ field.html_name }}" id="{{ field.id_for_label }}" inputmode="{{ inputmode|default:'numeric' }}" autocomplete="one-time-code" autofocus required
       class="w-full px-3.5 py-2.5 bg-panel border border-border-subtle rounded-control text-zinc-100 placeholder-zinc-600 focus:border-border-strong focus:ring-1 focus:ring-border-strong focus:outline-none transition-colors text-sm font-mono tracking-widest"
       placeholder="{{ placeholder|default:'123456' }}">
{% if field.errors %}<p class="text-error text-sm mt-1">{{ field.errors.0 }}</p>{% endif %}
