<div class="flex items-center justify-between p-3 bg-panel/70 rounded-card border border-border-subtle" id="label-{{ label.pk }}">
    <div class="flex items-center gap-3">
        <div class="w-4 h-4 rounded" style="background-color: {{ label.color }}"></div>
        <span class="text-sm text-zinc-300">{{ label.name }}</span>
    </div>
    <button hx-post="{% url 'label_delete' project.pk label.pk %}"
            hx-target="#label-{{ label.pk }}"
            hx-swap="outerHTML"
            hx-confirm="Delete this label?"
            class="text-zinc-500 hover:text-red-400 transition-colors">
        <i data-lucide="x" class="w-4 h-4"></i>
    </button>
</div>
