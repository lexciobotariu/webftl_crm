<div class="flex flex-col h-full">
    <!-- Drawer header -->
    <div class="flex-shrink-0 px-4 py-3 border-b border-border-subtle bg-panel/80">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i data-lucide="user-plus" class="w-4 h-4 text-zinc-500"></i>
                <h2 class="text-sm font-medium text-zinc-100">New Client</h2>
            </div>
            <button onclick="document.getElementById('slide-over').classList.add('hidden')"
                    class="p-1.5 text-zinc-500 hover:text-zinc-300 hover:bg-elevated rounded transition-colors">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- Form -->
    <form hx-post="{% url 'client_create_drawer' %}"
          hx-target="#client-list"
          hx-swap="beforeend"
          class="flex-1 overflow-y-auto p-4">
        {% csrf_token %}

        <div class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wide text-zinc-500 mb-1.5">Name</label>
                <input type="text" name="name"
                       class="w-full bg-elevated border border-border-subtle rounded-card px-3 py-2 text-sm text-zinc-100 focus:border-accent focus:ring-1 focus:ring-accent focus:outline-none"
                       required>
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wide text-zinc-500 mb-1.5">Email</label>
                <input type="email" name="email"
                       class="w-full bg-elevated border border-border-subtle rounded-card px-3 py-2 text-sm text-zinc-100 focus:border-accent focus:ring-1 focus:ring-accent focus:outline-none">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wide text-zinc-500 mb-1.5">Phone</label>
                <input type="text" name="phone"
                       class="w-full bg-elevated border border-border-subtle rounded-card px-3 py-2 text-sm text-zinc-100 focus:border-accent focus:ring-1 focus:ring-accent focus:outline-none">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wide text-zinc-500 mb-1.5">Address</label>
                <textarea name="address" rows="3"
                          class="w-full bg-elevated border border-border-subtle rounded-card px-3 py-2 text-sm text-zinc-100 focus:border-accent focus:ring-1 focus:ring-accent focus:outline-none resize-none"></textarea>
            </div>
        </div>

        <div class="flex gap-3 mt-6 pt-4 border-t border-border-subtle">
            <button type="submit"
                    class="bg-accent text-white px-4 py-2 rounded-card text-sm font-medium hover:bg-accent-hover transition-colors">
                Create Client
            </button>
            <button type="button"
                    onclick="document.getElementById('slide-over').classList.add('hidden')"
                    class="bg-elevated border border-border-subtle px-4 py-2 rounded-card text-sm text-zinc-400 hover:text-zinc-200 hover:bg-hover-strong transition-colors">
                Cancel
            </button>
        </div>
    </form>
</div>
<script>
document.getElementById('slide-over').classList.remove('hidden');
lucide.createIcons();
</script>
