# Dokploy-only stack. In the Dokploy UI set Compose Path to
# ./docker-compose.dokploy.yml. Local Mac development stays on docker-compose.yml.
#
# Attach the public hostname on the Domains tab to the web service, container
# port 8000. Dokploy injects Traefik labels during deploy. This file does not
# publish host ports, set container_name, or hardcode a domain.
#
# Postgres is a separate Dokploy database. The Environment tab is written to a
# .env file next to this compose file and is not injected unless referenced
# below. Set DATABASE_URL to that database's internal connection URL.
# The image entrypoint runs migrate --noinput once, then execs gunicorn.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      FERNET_KEY: ${FERNET_KEY:?FERNET_KEY is required}
      DEBUG: ${DEBUG:-False}
      TIME_ZONE: ${TIME_ZONE:-Europe/Bucharest}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      USE_X_FORWARDED_PROTO: ${USE_X_FORWARDED_PROTO:-True}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-webmaster@localhost}
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
