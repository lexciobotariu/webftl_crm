{% extends "account/security_base.html" %}

{% block security_content %}
<section class="border border-border-subtle rounded-card p-4 space-y-4">
    <h1 class="text-sm font-medium text-zinc-100">New recovery codes</h1>
    <p class="text-sm text-zinc-400">You get a new set of codes.{% if unused_code_count %} The {{ unused_code_count }} codes you still have stop working.{% endif %}</p>
    <form method="post" action="{% url 'mfa_generate_recovery_codes' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="bg-accent text-on-accent px-4 py-2 rounded-control text-sm font-medium hover:bg-accent-hover transition-colors">Create new codes</button>
    </form>
    <a href="{% url 'mfa_index' %}" class="inline-block text-sm text-zinc-500 hover:text-zinc-300">Back</a>
</section>
{% endblock %}
