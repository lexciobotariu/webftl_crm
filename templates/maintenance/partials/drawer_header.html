<div class="flex-shrink-0 px-4 py-3 border-b border-border-subtle bg-panel/80">
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
            <i data-lucide="{{ icon|default:'wrench' }}" class="w-4 h-4 text-zinc-500"></i>
            <h2 class="text-sm font-medium text-zinc-100">{{ title }}</h2>
        </div>
        <button type="button" onclick="closeSlideOver()" class="p-1.5 text-zinc-500 hover:text-zinc-300 hover:bg-elevated rounded transition-colors" aria-label="Close">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
    </div>
</div>
