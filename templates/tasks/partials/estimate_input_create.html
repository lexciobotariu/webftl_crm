<div class="relative" x-data="dropdown">
    <button type="button" @click="toggle()"
            class="flex items-center gap-2 px-2 py-1.5 rounded-control text-sm text-zinc-300 hover:bg-elevated transition-colors w-full">
        {% if form.estimate.value %}
        {{ form.estimate.value }}
        {% else %}
        <span class="text-zinc-500">Add estimate</span>
        {% endif %}
    </button>
    <div x-show="open" x-cloak @click.away="close()"
         x-transition
         class="absolute left-0 top-full mt-1 bg-elevated border border-border-subtle rounded-card shadow-lg z-20 p-3">
        <input type="text" name="estimate" value="{{ form.estimate.value|default:'' }}"
               placeholder="e.g. 1h 30m" autocomplete="off" aria-label="Estimate" @keydown.enter.prevent="close()"
               class="w-28 bg-panel border border-border-subtle rounded-control px-3 py-2 text-sm text-zinc-100 focus:border-border-strong focus:outline-none">
        <button type="button" @click="close()" class="bg-accent text-on-accent px-3 py-1 rounded-control text-xs ml-2">Done</button>
    </div>
</div>
