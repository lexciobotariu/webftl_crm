<div class="relative" x-data="dropdown">
    <button {% if can_edit %}@click="toggle()"{% else %}disabled{% endif %}
            class="flex items-center gap-2 px-2 py-1 rounded-control text-sm text-zinc-300 hover:bg-elevated transition-colors disabled:cursor-default disabled:hover:bg-transparent">
        {% include "components/priority_icon.html" with priority=task.priority %}
        {% if task.priority %}
        {{ task.get_priority_display }}
        {% else %}
        <span class="text-zinc-500">None</span>
        {% endif %}
    </button>
    {% if can_edit %}
    <div x-show="open" x-cloak @click.away="close()"
         x-transition
         class="absolute left-0 top-full mt-1 w-40 bg-elevated border border-border-subtle rounded-card shadow-lg z-20 py-1">
        <button hx-post="{% url 'task_update_priority' task.pk %}"
                hx-vals='{"priority": ""}'
                hx-target="#priority-value-{{ task.pk }}"
                hx-swap="innerHTML"
                @click="close()"
                class="w-full flex items-center gap-2 text-left px-3 py-2 text-sm hover:bg-hover-strong transition-colors text-zinc-400">
            {% include "components/priority_icon.html" with priority="" %}
            None
        </button>
        {% for value, label in priority_choices %}
        <button hx-post="{% url 'task_update_priority' task.pk %}"
                hx-vals='{"priority": "{{ value }}"}'
                hx-target="#priority-value-{{ task.pk }}"
                hx-swap="innerHTML"
                @click="close()"
                class="w-full flex items-center gap-2 text-left px-3 py-2 text-sm hover:bg-hover-strong transition-colors
                       {% if value == task.priority %}text-zinc-100{% else %}text-zinc-300{% endif %}">
            {% include "components/priority_icon.html" with priority=value %}
            {{ label }}
        </button>
        {% endfor %}
    </div>
    {% endif %}
</div>
