{# Priority icon, as in Linear. Pass priority=<task.priority> ('' = none); optional size (px, default 14). #}
{% with px=size|default:14 %}
{% if priority == 'urgent' %}
<svg width="{{ px }}" height="{{ px }}" viewBox="0 0 14 14" fill="none" aria-hidden="true" class="shrink-0 text-error">
    <rect x="0.5" y="0.5" width="13" height="13" rx="3" fill="currentColor"/>
    <path d="M7 3.5v4M7 9.6v.9" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
</svg>
{% elif priority == 'high' or priority == 'medium' or priority == 'low' %}
<svg width="{{ px }}" height="{{ px }}" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true" class="shrink-0 text-zinc-300">
    <rect x="1.5" y="8.5" width="3" height="4" rx="0.75"/>
    <rect x="5.5" y="5.5" width="3" height="7" rx="0.75" {% if priority == 'high' or priority == 'medium' %}{% else %}opacity=".25"{% endif %}/>
    <rect x="9.5" y="2.5" width="3" height="10" rx="0.75" {% if priority == 'high' %}{% else %}opacity=".25"{% endif %}/>
</svg>
{% else %}
<svg width="{{ px }}" height="{{ px }}" viewBox="0 0 14 14" fill="none" aria-hidden="true" class="shrink-0 text-zinc-600">
    <path d="M2 7h2.5M5.75 7h2.5M9.5 7H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
{% endif %}
{% endwith %}
