<div class="relative" x-data="{ open: false, estimate: '{{ form.time_estimate.value|default:'' }}' }">
    <input type="hidden" name="time_estimate" :value="estimate">
    <button type="button" @click="open = !open"
            class="flex items-center gap-2 px-2 py-1.5 rounded-card text-sm text-zinc-300 hover:bg-elevated transition-colors w-full">
        <template x-if="estimate">
            <span x-text="estimate + 'h'"></span>
        </template>
        <template x-if="!estimate">
            <span class="text-zinc-500">Add estimate</span>
        </template>
    </button>
    <div x-show="open" x-cloak @click.away="open = false"
         x-transition
         class="absolute left-0 top-full mt-1 bg-elevated border border-border-subtle rounded-card shadow-lg z-20 p-3">
        <div class="flex items-center gap-2">
            <input type="number" x-model="estimate" step="0.5" min="0"
                   placeholder="Hours"
                   class="w-24 bg-panel border border-border-subtle rounded-card px-3 py-2 text-sm text-zinc-100 focus:border-accent focus:outline-none">
            <span class="text-zinc-500 text-sm">hours</span>
        </div>
        <div class="flex gap-2 mt-2">
            <button type="button" @click="open = false" class="bg-accent text-white px-3 py-1 rounded-card text-xs">Done</button>
            <button type="button" @click="estimate = ''; open = false" class="text-zinc-400 hover:text-red-400 px-3 py-1 text-xs">Clear</button>
        </div>
    </div>
</div>
