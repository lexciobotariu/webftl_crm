<div id="prop-logged-{{ task.pk }}"
     class="flex items-center py-2 px-2 hover:bg-hover rounded-card"
     hx-get="{% url 'task_logged_total' task.pk %}"
     hx-trigger="timerChanged from:body"
     hx-swap="outerHTML">
    <div class="flex items-center gap-2 w-28 text-zinc-500 text-sm">
        <i data-lucide="timer" class="w-4 h-4"></i>
        <span>Logged</span>
    </div>
    <div class="flex-1 px-2 py-1 text-sm text-zinc-300">
        {{ logged_label }}
    </div>
</div>
