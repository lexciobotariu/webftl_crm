{# Round initial avatar. Pass user=<user or None>; optional size (px, default 20). Empty when unassigned. #}
{% with px=size|default:20 %}
{% if user %}
<span class="shrink-0 inline-flex items-center justify-center rounded-full bg-elevated border border-border-subtle text-zinc-200 font-semibold"
      style="width:{{ px }}px;height:{{ px }}px;font-size:{% widthratio px 20 10 %}px"
      title="{{ user.name }}">{{ user.name|slice:":1"|upper }}</span>
{% else %}
<span class="shrink-0 inline-flex items-center justify-center rounded-full border border-dashed border-zinc-600 text-zinc-600"
      style="width:{{ px }}px;height:{{ px }}px" title="Unassigned">
    <svg width="{% widthratio px 20 10 %}" height="{% widthratio px 20 10 %}" viewBox="0 0 10 10" fill="none" aria-hidden="true"><circle cx="5" cy="3.5" r="1.7" stroke="currentColor" stroke-width="1"/><path d="M1.8 9c.3-1.8 1.6-2.7 3.2-2.7S7.9 7.2 8.2 9" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
</span>
{% endif %}
{% endwith %}
