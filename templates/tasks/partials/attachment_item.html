<div class="group flex items-center gap-2 text-sm">
    <a href="{% url 'attachment_download' attachment.pk %}" target="_blank" rel="noopener" class="text-zinc-200 hover:text-zinc-50/80 flex-1 min-w-0 flex items-center gap-1">
        <i data-lucide="paperclip" class="w-3 h-3 shrink-0"></i>
        <span class="truncate">{{ attachment.filename }}</span>
    </a>
    <span class="text-xs text-zinc-500">{{ attachment.uploaded_at|date:"M d" }}</span>
    {% if can_edit %}
    <button type="button"
            hx-post="{% url 'attachment_delete' attachment.pk %}"
            hx-target="closest div"
            hx-swap="outerHTML"
            hx-confirm="Remove {{ attachment.filename }}?"
            class="text-zinc-500 hover:text-error opacity-0 group-hover:opacity-100 focus:opacity-100 transition-opacity"
            title="Remove" aria-label="Remove {{ attachment.filename }}">
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
    </button>
    {% endif %}
</div>
