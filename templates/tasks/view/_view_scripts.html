{% comment %}Re-fetches the view through the current URL after an edit. It sits outside #task-view so it survives every swap.
   Optional refresh_oob: a selector list for anything else the same response should update (My Tasks passes its count badge).{% endcomment %}
<div id="task-view-refresh" hidden
     hx-target="#task-view" hx-select="#task-view" hx-swap="outerHTML"{% if refresh_oob %}
     hx-select-oob="{{ refresh_oob }}"{% endif %}></div>
<script>
    // Back must show the URL's state, not a cached copy of an earlier list. With no
    // cache every restore is a miss, and a miss is a real page load rather than an
    // AJAX swap of <body>: that keeps these page scripts from running a second time
    // (and registering the listeners below twice) on every Back.
    htmx.config.historyCacheSize = 0;
    htmx.config.refreshOnHistoryMiss = true;
    // Edits made in the drawer (and task create/delete/move) change what the list
    // shows; re-fetch it through the current URL so filters and "Show more" survive.
    // The request goes out in the refresher's name, so it is one round trip for the
    // view and whatever refresh_oob names, and never counts as a toolbar change.
    ['taskChanged', 'taskStatusChanged'].forEach((name) => {
        document.body.addEventListener(name, () => {
            htmx.ajax('GET', window.location.href, { source: '#task-view-refresh' });
        });
    });
</script>
