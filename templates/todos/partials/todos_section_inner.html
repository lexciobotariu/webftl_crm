{% load static %}

<!-- Todos Section Inner (Dynamic HTMX Target) -->
<div id="todos-section-inner"
     hx-get="{% if client %}{% url 'client_todo_list' client.id %}{% else %}{% url 'todo_list' %}{% endif %}{% if show_completed %}?show_completed=true{% endif %}"
     hx-trigger="{% if client %}refreshClientTodos from:body{% else %}refreshPersonalTodos from:body{% endif %}"
     hx-target="#todos-section-inner"
     hx-swap="outerHTML">
    <!-- Header with controls -->
    <div class="px-4 py-2 border-b border-border-subtle bg-panel/80">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i data-lucide="check-square" class="w-4 h-4 text-zinc-500"></i>
                <h2 class="text-sm font-medium text-zinc-100">
                    {% if client %}To-Dos{% else %}Personal To-Dos{% endif %}
                </h2>
                <span class="text-xs text-zinc-500 bg-elevated px-1.5 py-0.5 rounded">{{ todo_count|default:todos.count }}</span>
            </div>
            <div class="flex items-center gap-3">
                <!-- Show completed toggle -->
                <button hx-get="{% if client %}{% url 'client_todo_list' client.id %}{% else %}{% url 'todo_list' %}{% endif %}?show_completed={{ show_completed|yesno:'false,true' }}"
                        hx-target="#todos-section-inner"
                        hx-swap="outerHTML"
                        class="flex items-center gap-2 px-3 py-1.5 text-xs text-zinc-400 hover:text-zinc-200 hover:bg-hover rounded-lg transition-colors">
                    <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                    {% if show_completed %}Hide{% else %}Show{% endif %} completed
                </button>
                <!-- Add todo button -->
                <button hx-get="{% if client %}{% url 'client_todo_create' client.id %}{% else %}{% url 'todo_create' %}{% endif %}"
                        hx-target="#slide-over"
                        hx-swap="innerHTML"
                        hx-on::after-request="document.getElementById('slide-over').classList.remove('hidden'); lucide.createIcons();"
                        class="inline-flex items-center gap-1.5 bg-accent text-white px-3 py-1.5 rounded-card text-xs font-medium hover:bg-accent-hover transition-colors">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    Add To-Do
                </button>
            </div>
        </div>
    </div>

    <!-- Todo list -->
    {% include 'todos/partials/todo_list.html' %}
</div>

<script>
    if (typeof lucide !== 'undefined') {
        lucide.createIcons();
    }
</script>
