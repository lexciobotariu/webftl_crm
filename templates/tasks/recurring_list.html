{% extends "base.html" %}

{% block title %}{{ project.name }} - Recurring tasks - WebFTL CRM{% endblock %}

{% block full_content %}
<div class="flex flex-col h-full">
    <div class="flex-shrink-0 px-4 py-2 border-b border-border-subtle bg-panel/80">
        <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <a href="{% url 'project_tasks' project.pk %}" class="p-1 text-zinc-500 hover:text-zinc-300 hover:bg-elevated rounded transition-colors" title="Back to Tasks">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                </a>
                <div class="flex items-center gap-2 text-sm min-w-0">
                    <span class="flex items-center gap-1.5 text-zinc-500"><i data-lucide="building-2" class="w-3.5 h-3.5"></i><span>{{ project.client.name }}</span></span>
                    <span class="text-zinc-600">/</span>
                    <a href="{% url 'project_detail' project.pk %}" class="flex items-center gap-1.5 text-zinc-500 hover:text-zinc-300 transition-colors"><i data-lucide="folder" class="w-3.5 h-3.5"></i><span class="truncate">{{ project.name }}</span></a>
                    <span class="text-zinc-600">/</span>
                    <span class="flex items-center gap-1.5 text-zinc-100 font-medium"><i data-lucide="repeat" class="w-3.5 h-3.5"></i><span>Recurring tasks</span></span>
                </div>
            </div>
            <a href="{% url 'project_tasks' project.pk %}" class="inline-flex items-center gap-1.5 bg-elevated border border-border-subtle px-3 py-1.5 rounded-control text-xs text-zinc-300 hover:bg-hover transition-colors"><i data-lucide="check-square" class="w-3.5 h-3.5"></i>Tasks</a>
        </div>
    </div>
    <div class="flex-1 overflow-y-auto p-6">
        <div class="max-w-4xl">
            {% include "tasks/partials/recurring_panel.html" %}
        </div>
    </div>
</div>
{% endblock %}
