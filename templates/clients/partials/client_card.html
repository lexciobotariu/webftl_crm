<div class="bg-card/90 rounded-card border border-border-subtle p-5 transition-all hover:border-border-strong hover:bg-elevated/90" id="client-{{ client.pk }}">
    <a href="{% url 'client_detail' client.pk %}" class="block">
        <h3 class="font-semibold text-base text-zinc-100 mb-2">{{ client.name }}</h3>
        {% if client.email %}
        <div class="text-sm text-zinc-400 mb-1 flex items-center gap-2">
            <i data-lucide="mail" class="w-3 h-3"></i>
            {{ client.email }}
        </div>
        {% endif %}
        {% if client.phone %}
        <div class="text-sm text-zinc-400 mb-2 flex items-center gap-2">
            <i data-lucide="phone" class="w-3 h-3"></i>
            {{ client.phone }}
        </div>
        {% endif %}
        <div class="text-xs text-zinc-500 flex items-center gap-2">
            <i data-lucide="folder-kanban" class="w-3 h-3"></i>
            {{ client.project_count }} project{{ client.project_count|pluralize }}
        </div>
    </a>
</div>
