<div class="relative" x-data="{ open: false, date: '{{ form.due_date.value|date:'Y-m-d'|default:'' }}' }">
    <input type="hidden" name="due_date" :value="date">
    <button type="button" @click="open = !open"
            class="flex items-center gap-2 px-2 py-1.5 rounded-card text-sm text-zinc-300 hover:bg-elevated transition-colors w-full">
        <template x-if="date">
            <span class="flex items-center gap-2">
                <i data-lucide="calendar" class="w-3.5 h-3.5 text-zinc-500"></i>
                <span x-text="new Date(date + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })"></span>
            </span>
        </template>
        <template x-if="!date">
            <span class="text-zinc-500">Add due date</span>
        </template>
    </button>
    <div x-show="open" x-cloak @click.away="open = false"
         x-transition
         class="absolute left-0 top-full mt-1 bg-elevated border border-border-subtle rounded-card shadow-lg z-20 p-3">
        <input type="date" x-model="date"
               class="bg-panel border border-border-subtle rounded-card px-3 py-2 text-sm text-zinc-100 focus:border-accent focus:outline-none">
        <div class="flex gap-2 mt-2">
            <button type="button" @click="open = false" class="bg-accent text-white px-3 py-1 rounded-card text-xs">Done</button>
            <button type="button" @click="date = ''; open = false" class="text-zinc-400 hover:text-red-400 px-3 py-1 text-xs">Clear</button>
        </div>
    </div>
</div>
