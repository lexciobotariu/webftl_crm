<div class="relative" x-data="{ open: false, selectedId: '{{ form.assignee.value|default:'' }}', selectedName: '{% if form.assignee.value %}{{ form.instance.assignee.name|default:''|escapejs }}{% endif %}' }">
    <input type="hidden" name="assignee" :value="selectedId">
    <button type="button" @click="open = !open"
            class="flex items-center gap-2 px-2 py-1.5 rounded-card text-sm text-zinc-300 hover:bg-elevated transition-colors w-full">
        <template x-if="selectedId">
            <span class="flex items-center gap-2">
                <span class="w-5 h-5 rounded-full bg-accent/30 flex items-center justify-center text-[10px] text-accent"
                      x-text="selectedName.charAt(0).toUpperCase()"></span>
                <span x-text="selectedName"></span>
            </span>
        </template>
        <template x-if="!selectedId">
            <span class="text-zinc-500">Add assignee</span>
        </template>
    </button>
    <div x-show="open" x-cloak @click.away="open = false"
         x-transition
         class="absolute left-0 top-full mt-1 w-56 bg-elevated border border-border-subtle rounded-card shadow-lg z-20 py-1 max-h-64 overflow-y-auto">
        <button type="button" @click="selectedId = ''; selectedName = ''; open = false"
                class="w-full text-left px-3 py-2 text-sm text-zinc-400 hover:bg-hover-strong transition-colors">
            Unassigned
        </button>
        {% for user in team_members %}
        <button type="button" @click="selectedId = '{{ user.pk }}'; selectedName = '{{ user.name|escapejs }}'; open = false"
                class="w-full text-left px-3 py-2 text-sm hover:bg-hover-strong transition-colors flex items-center gap-2 text-zinc-300">
            <span class="w-5 h-5 rounded-full bg-accent/30 flex items-center justify-center text-[10px] text-accent">
                {{ user.name|slice:":1"|upper }}
            </span>
            {{ user.name }}
        </button>
        {% endfor %}
    </div>
</div>
