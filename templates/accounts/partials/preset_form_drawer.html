<div class="flex flex-col h-full">
    <!-- Header -->
    <div class="flex-shrink-0 px-4 py-3 border-b border-border-subtle bg-panel/80">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i data-lucide="shield" class="w-4 h-4 text-zinc-500"></i>
                <h2 class="text-sm font-medium text-zinc-100">
                    {% if preset %}Edit Preset{% else %}New Preset{% endif %}
                </h2>
            </div>
            <button onclick="closeSlideOver()"
                    class="p-1.5 text-zinc-500 hover:text-zinc-300 hover:bg-elevated rounded transition-colors">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- Form -->
    <form hx-post="{% if preset %}{% url 'preset_edit' preset.pk %}{% else %}{% url 'preset_create' %}{% endif %}"
          hx-target="#slide-over"
          hx-swap="innerHTML"
          class="flex-1 overflow-y-auto p-4">
        {% csrf_token %}

        {% if error %}
        <div class="mb-4 p-3 bg-red-500/10 border border-red-500/20 rounded-card">
            <p class="text-sm text-red-400">{{ error }}</p>
        </div>
        {% endif %}

        <div class="space-y-4">
            <!-- Name -->
            <div>
                <label class="block text-xs uppercase tracking-wide text-zinc-500 mb-1.5">Name</label>
                {% if preset.is_system %}
                <div class="w-full bg-panel border border-border-subtle rounded-card px-3 py-2 text-sm text-zinc-400">
                    {{ preset.name }}
                </div>
                {% else %}
                <input type="text" name="name" required
                       value="{% if preset %}{{ preset.name }}{% else %}{{ form_name }}{% endif %}"
                       class="w-full bg-elevated border border-border-subtle rounded-card px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:border-accent focus:ring-1 focus:ring-accent focus:outline-none"
                       placeholder="e.g. Contractor">
                {% endif %}
            </div>

            <!-- Description -->
            <div>
                <label class="block text-xs uppercase tracking-wide text-zinc-500 mb-1.5">Description</label>
                <input type="text" name="description"
                       value="{% if preset %}{{ preset.description }}{% else %}{{ form_description }}{% endif %}"
                       class="w-full bg-elevated border border-border-subtle rounded-card px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:border-accent focus:ring-1 focus:ring-accent focus:outline-none"
                       placeholder="Brief description of this role">
            </div>

            <!-- Permissions -->
            <div>
                <label class="block text-xs uppercase tracking-wide text-zinc-500 mb-3">Permissions</label>
                <div class="space-y-2">
                    <label data-module="dashboard" class="flex items-center justify-between gap-3 p-3 bg-elevated/50 rounded-card border border-border-subtle hover:border-border-strong transition-colors cursor-pointer">
                        <span class="flex items-center gap-2">
                            <i data-lucide="layout-dashboard" class="w-4 h-4 text-zinc-500"></i>
                            <span class="text-sm text-zinc-300">Dashboard</span>
                        </span>
                        <input type="checkbox" name="access_dashboard" {% if not preset or preset.access_dashboard %}checked{% endif %}
                               class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                    </label>

                    <div data-module="clients"
                         class="bg-elevated/50 rounded-card border border-border-subtle hover:border-border-strong transition-colors"
                         x-data="{
                            open: {% if not preset or preset.access_clients %}true{% else %}false{% endif %},
                            enabled: {% if not preset or preset.access_clients %}true{% else %}false{% endif %},
                            init() {
                                this.$watch('enabled', (on) => {
                                    this.open = on;
                                    if (!on) {
                                        this.$root.querySelectorAll('[data-extra]').forEach((box) => {
                                            box.checked = false;
                                        });
                                    }
                                });
                            }
                         }">
                        <div class="flex items-center justify-between gap-3 p-3">
                            <button type="button"
                                    class="flex items-center gap-2 min-w-0 text-left"
                                    @click="open = !open"
                                    :aria-expanded="open">
                                <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-500 transition-transform" :class="{ 'rotate-90': open }"></i>
                                <i data-lucide="building-2" class="w-4 h-4 text-zinc-500"></i>
                                <span class="text-sm text-zinc-300">Clients</span>
                            </button>
                            <input type="checkbox" name="access_clients" {% if not preset or preset.access_clients %}checked{% endif %}
                                   class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent"
                                   x-model="enabled"
                                   @click.stop>
                        </div>
                        <div x-show="open" x-collapse {% if preset and not preset.access_clients %}x-cloak{% endif %}>
                            <div class="grid grid-cols-2 gap-x-3 gap-y-2 pt-0 px-3 pb-3 ml-12" :class="{ 'opacity-40': !enabled }">
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="clients_view_all"{% if preset.access_clients and preset.clients_view_all %} checked{% endif %}{% if preset and not preset.access_clients %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                                    <span class="text-sm text-zinc-300">View all</span>
                                </label>
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="clients_create"{% if preset.access_clients and preset.clients_create %} checked{% endif %}{% if preset and not preset.access_clients %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                                    <span class="text-sm text-zinc-300">Create</span>
                                </label>
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="clients_edit"{% if preset.access_clients and preset.clients_edit %} checked{% endif %}{% if preset and not preset.access_clients %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                                    <span class="text-sm text-zinc-300">Edit</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div data-module="projects"
                         class="bg-elevated/50 rounded-card border border-border-subtle hover:border-border-strong transition-colors"
                         x-data="{
                            open: {% if not preset or preset.access_projects %}true{% else %}false{% endif %},
                            enabled: {% if not preset or preset.access_projects %}true{% else %}false{% endif %},
                            init() {
                                this.$watch('enabled', (on) => {
                                    this.open = on;
                                    if (!on) {
                                        this.$root.querySelectorAll('[data-extra]').forEach((box) => {
                                            box.checked = false;
                                        });
                                    }
                                });
                            }

                        <div class="flex items-center justify-between gap-3 p-3">
                            <button type="button"
                                    class="flex items-center gap-2 min-w-0 text-left"
                                    @click="open = !open"
                                    :aria-expanded="open">
                                <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-500 transition-transform" :class="{ 'rotate-90': open }"></i>
                                <i data-lucide="folder-kanban" class="w-4 h-4 text-zinc-500"></i>
                                <span class="text-sm text-zinc-300">Projects</span>
                            </button>
                            <input type="checkbox" name="access_projects" {% if not preset or preset.access_projects %}checked{% endif %}
                                   class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent"
                                   x-model="enabled"
                                   @click.stop>
                        </div>
                        <div x-show="open" x-collapse {% if preset and not preset.access_projects %}x-cloak{% endif %}>
                            <div class="grid grid-cols-2 gap-x-3 gap-y-2 pt-0 px-3 pb-3 ml-12" :class="{ 'opacity-40': !enabled }">
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="projects_view_all"{% if preset.access_projects and preset.projects_view_all %} checked{% endif %}{% if preset and not preset.access_projects %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                                    <span class="text-sm text-zinc-300">View all</span>
                                </label>
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="projects_create"{% if preset.access_projects and preset.projects_create %} checked{% endif %}{% if preset and not preset.access_projects %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                                    <span class="text-sm text-zinc-300">Create</span>
                                </label>
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="projects_edit_own"{% if preset.access_projects and preset.projects_edit_own %} checked{% endif %}{% if preset and not preset.access_projects %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                                    <span class="text-sm text-zinc-300">Edit own</span>
                                </label>
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="projects_edit_all"{% if preset.access_projects and preset.projects_edit_all %} checked{% endif %}{% if preset and not preset.access_projects %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                                    <span class="text-sm text-zinc-300">Edit all</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div data-module="tasks"
                         class="bg-elevated/50 rounded-card border border-border-subtle hover:border-border-strong transition-colors"
                         x-data="{
                            open: {% if not preset or preset.access_tasks %}true{% else %}false{% endif %},
                            enabled: {% if not preset or preset.access_tasks %}true{% else %}false{% endif %},
                            init() {
                                this.$watch('enabled', (on) => {
                                    this.open = on;
                                    if (!on) {
                                        this.$root.querySelectorAll('[data-extra]').forEach((box) => {
                                            box.checked = false;
                                        });
                                    }
                                });
                            }
                         }">
                        <div class="flex items-center justify-between gap-3 p-3">
                            <button type="button"
                                    class="flex items-center gap-2 min-w-0 text-left"
                                    @click="open = !open"
                                    :aria-expanded="open">
                                <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-500 transition-transform" :class="{ 'rotate-90': open }"></i>
                                <i data-lucide="user-check" class="w-4 h-4 text-zinc-500"></i>
                                <span class="text-sm text-zinc-300">Tasks</span>
                            </button>
                            <input type="checkbox" name="access_tasks" {% if not preset or preset.access_tasks %}checked{% endif %}
                                   class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent"
                                   x-model="enabled"
                                   @click.stop>
                        </div>
                        <div x-show="open" x-collapse {% if preset and not preset.access_tasks %}x-cloak{% endif %}>
                            <div class="grid grid-cols-2 gap-x-3 gap-y-2 pt-0 px-3 pb-3 ml-12" :class="{ 'opacity-40': !enabled }">
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="tasks_view_all"{% if preset.access_tasks and preset.tasks_view_all %} checked{% endif %}{% if preset and not preset.access_tasks %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                                    <span class="text-sm text-zinc-300">View all</span>
                                </label>
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="tasks_create"{% if preset.access_tasks and preset.tasks_create %} checked{% endif %}{% if preset and not preset.access_tasks %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                                    <span class="text-sm text-zinc-300">Create</span>
                                </label>
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="tasks_edit_own"{% if preset.access_tasks and preset.tasks_edit_own %} checked{% endif %}{% if preset and not preset.access_tasks %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                                    <span class="text-sm text-zinc-300">Edit own</span>
                                </label>
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="tasks_edit_all"{% if preset.access_tasks and preset.tasks_edit_all %} checked{% endif %}{% if preset and not preset.access_tasks %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                                    <span class="text-sm text-zinc-300">Edit all</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <label data-module="todos" class="flex items-center justify-between gap-3 p-3 bg-elevated/50 rounded-card border border-border-subtle hover:border-border-strong transition-colors cursor-pointer">
                        <span class="flex items-center gap-2">
                            <i data-lucide="circle-check" class="w-4 h-4 text-zinc-500"></i>
                            <span class="text-sm text-zinc-300">Todos</span>
                        </span>
                        <input type="checkbox" name="access_todos" {% if not preset or preset.access_todos %}checked{% endif %}
                               class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                    </label>

                    <div data-module="notes"
                         class="bg-elevated/50 rounded-card border border-border-subtle hover:border-border-strong transition-colors"
                         x-data="{
                            open: {% if not preset or preset.access_notes %}true{% else %}false{% endif %},
                            enabled: {% if not preset or preset.access_notes %}true{% else %}false{% endif %},
                            init() {
                                this.$watch('enabled', (on) => {
                                    this.open = on;
                                    if (!on) {
                                        this.$root.querySelectorAll('[data-extra]').forEach((box) => {
                                            box.checked = false;
                                        });
                                    }
                                });
                            }
                         }">
                        <div class="flex items-center justify-between gap-3 p-3">
                            <button type="button"
                                    class="flex items-center gap-2 min-w-0 text-left"
                                    @click="open = !open"
                                    :aria-expanded="open">
                                <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-500 transition-transform" :class="{ 'rotate-90': open }"></i>
                                <i data-lucide="sticky-note" class="w-4 h-4 text-zinc-500"></i>
                                <span class="text-sm text-zinc-300">Notes</span>
                            </button>
                            <input type="checkbox" name="access_notes" {% if not preset or preset.access_notes %}checked{% endif %}
                                   class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent"
                                   x-model="enabled"
                                   @click.stop>
                        </div>
                        <div x-show="open" x-collapse {% if preset and not preset.access_notes %}x-cloak{% endif %}>
                            <div class="grid grid-cols-2 gap-x-3 gap-y-2 pt-0 px-3 pb-3 ml-12" :class="{ 'opacity-40': !enabled }">
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="notes_view_all"{% if preset.access_notes and preset.notes_view_all %} checked{% endif %}{% if preset and not preset.access_notes %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                                    <span class="text-sm text-zinc-300">View all</span>
                                </label>
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="notes_edit_public"{% if preset.access_notes and preset.notes_edit_public %} checked{% endif %}{% if preset and not preset.access_notes %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                                    <span class="text-sm text-zinc-300">Edit public</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div data-module="salaries"
                         class="bg-elevated/50 rounded-card border border-border-subtle hover:border-border-strong transition-colors"
                         x-data="{
                            open: {% if not preset or preset.access_salaries %}true{% else %}false{% endif %},
                            enabled: {% if not preset or preset.access_salaries %}true{% else %}false{% endif %},
                            init() {
                                this.$watch('enabled', (on) => {
                                    this.open = on;
                                    if (!on) {
                                        this.$root.querySelectorAll('[data-extra]').forEach((box) => {
                                            box.checked = false;
                                        });
                                    }
                                });
                            }
                         }">
                        <div class="flex items-center justify-between gap-3 p-3">
                            <button type="button"
                                    class="flex items-center gap-2 min-w-0 text-left"
                                    @click="open = !open"
                                    :aria-expanded="open">
                                <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-500 transition-transform" :class="{ 'rotate-90': open }"></i>
                                <i data-lucide="wallet" class="w-4 h-4 text-zinc-500"></i>
                                <span class="text-sm text-zinc-300">Salaries</span>
                            </button>
                            <input type="checkbox" name="access_salaries" {% if not preset or preset.access_salaries %}checked{% endif %}
                                   class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent"
                                   x-model="enabled"
                                   @click.stop>
                        </div>
                        <div x-show="open" x-collapse {% if preset and not preset.access_salaries %}x-cloak{% endif %}>
                            <div class="grid grid-cols-2 gap-x-3 gap-y-2 pt-0 px-3 pb-3 ml-12" :class="{ 'opacity-40': !enabled }">
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="salaries_view_all"{% if preset.access_salaries and preset.salaries_view_all %} checked{% endif %}{% if preset and not preset.access_salaries %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                                    <span class="text-sm text-zinc-300">View all</span>
                                </label>
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="salaries_edit"{% if preset.access_salaries and preset.salaries_edit %} checked{% endif %}{% if preset and not preset.access_salaries %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                                    <span class="text-sm text-zinc-300">Edit</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div data-module="team"
                         class="bg-elevated/50 rounded-card border border-border-subtle hover:border-border-strong transition-colors"
                         x-data="{
                            open: {% if not preset or preset.access_team %}true{% else %}false{% endif %},
                            enabled: {% if not preset or preset.access_team %}true{% else %}false{% endif %},
                            init() {
                                this.$watch('enabled', (on) => {
                                    this.open = on;
                                    if (!on) {
                                        this.$root.querySelectorAll('[data-extra]').forEach((box) => {
                                            box.checked = false;
                                        });
                                    }
                                });
                            }
                         }">
                        <div class="flex items-center justify-between gap-3 p-3">
                            <button type="button"
                                    class="flex items-center gap-2 min-w-0 text-left"
                                    @click="open = !open"
                                    :aria-expanded="open">
                                <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-500 transition-transform" :class="{ 'rotate-90': open }"></i>
                                <i data-lucide="users" class="w-4 h-4 text-zinc-500"></i>
                                <span class="text-sm text-zinc-300">Team</span>
                            </button>
                            <input type="checkbox" name="access_team" {% if not preset or preset.access_team %}checked{% endif %}
                                   class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent"
                                   x-model="enabled"
                                   @click.stop>
                        </div>
                        <div x-show="open" x-collapse {% if preset and not preset.access_team %}x-cloak{% endif %}>
                            <div class="grid grid-cols-2 gap-x-3 gap-y-2 pt-0 px-3 pb-3 ml-12" :class="{ 'opacity-40': !enabled }">
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="team_create"{% if preset.access_team and preset.team_create %} checked{% endif %}{% if preset and not preset.access_team %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">
                                    <span class="text-sm text-zinc-300">Create</span>
                                </label>
                                <label class="flex items-center gap-2 min-w-0">
                                    <input type="checkbox" name="team_edit"{% if preset.access_team and preset.team_edit %} checked{% endif %}{% if preset and not preset.access_team %} disabled{% endif %}
                                           data-extra :disabled="!enabled"
                                           class="w-4 h-4 shrink-0 bg-elevated border-border-subtle rounded text-accent focus:ring-accent">

                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex gap-3 mt-6 pt-4 border-t border-border-subtle">
            <button type="submit"
                    class="bg-accent text-white px-4 py-2 rounded-card text-sm font-medium hover:bg-accent-hover transition-colors">
                {% if preset %}Save Changes{% else %}Create Preset{% endif %}
            </button>
            <button type="button"
                    onclick="closeSlideOver()"
                    class="bg-elevated border border-border-subtle px-4 py-2 rounded-card text-sm text-zinc-400 hover:text-zinc-200 hover:bg-hover-strong transition-colors">
                Cancel
            </button>
        </div>
    </form>
</div>

<script>
if (typeof lucide !== 'undefined') {
    lucide.createIcons();
}
</script>
